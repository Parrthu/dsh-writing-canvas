# dsh-writing-canvas 组合包补丁层
#
# 把写作工作台挂载进 profile 的主机组合：
#   - 核心行：向全局系统提示注入「强指令约束」段；通过 webServer 暴露
#     /writing-canvas/api/* 路由；向 tools 注册 writing_* 工具
#   - 写作类型行：每个写作类型是**一行独立的插件**，可以在 profile 里
#     单独启用 / 停用 / 配置。这就是「插件中的插件」——用的正是 DSH 自己的
#     插件模式，而不是另造一套。
#
# 客户端半体由 package.json 的 dsh.client 声明，宿主会在 /plugins/dsh-writing-canvas/*
# 提供该 bundle。界面以两种形态存在：
#   1. 侧边栏入口（sidebar.panellist）+ 整页工作台（main 键 writing-canvas）
#   2. 对话旁常驻画布（sidebar.right.pane.tab 标签页类型，keepMounted）
#
# 注意：在用户 profile 的 cordis.patch.yml 中用 id 定向覆盖下面某行时，
# 会替换该行整个 config 对象，因此必须把所有字段一并写全。
- insert:
    # ---------- 核心 ----------
    - id: writing-canvas
      name: dsh-writing-canvas
      config:
        # 写作运行时状态目录（相对会话所属工作区）
        stateDir: .writing-canvas
        # 强指令约束提示段在系统提示中的顺序
        promptSectionOrder: 118
        # 单次保存允许的最大正文字节数
        maxDocumentBytes: 4194304

    # ---------- 写作类型（可单独停用：给对应行加 disabled: true）----------
    - id: writing-type-creative
      name: 'dsh-writing-canvas/type/creative'
    - id: writing-type-gongwen
      name: 'dsh-writing-canvas/type/gongwen'
    - id: writing-type-video-script
      name: 'dsh-writing-canvas/type/video-script'
    - id: writing-type-xiaohongshu
      name: 'dsh-writing-canvas/type/xiaohongshu'
    - id: writing-type-news
      name: 'dsh-writing-canvas/type/news'
